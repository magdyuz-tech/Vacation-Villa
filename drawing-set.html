<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Four-Storey Vacation Home — Drawing Set</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#11161c; --panel:#1a2029; --line:#2b333f; --ink:#e8ecf1;
  --muted:#93a0b0; --accent:#d8b26a; --paper:#fff;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font:14px/1.5 ui-sans-serif,
  -apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
header{
  padding:14px 20px; border-bottom:1px solid var(--line);
  display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
}
h1{font-size:15px; font-weight:700; letter-spacing:.14em; text-transform:uppercase}
header .sub{color:var(--muted); font-size:12px; letter-spacing:.04em}
nav{display:flex; gap:6px; padding:10px 16px; border-bottom:1px solid var(--line);
    background:var(--panel); flex-wrap:wrap; align-items:center}
button{
  font:inherit; color:var(--ink); background:transparent; cursor:pointer;
  border:1px solid var(--line); border-radius:6px; padding:7px 13px;
}
button:hover{border-color:var(--muted)}
.tab{display:flex; flex-direction:column; align-items:flex-start; line-height:1.25}
.tab b{font-size:12.5px; letter-spacing:.06em}
.tab span{font-size:11px; color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent); background:#232b36}
.tab[aria-selected="true"] b{color:var(--accent)}
.spacer{flex:1}
.zoom{display:flex; gap:6px; align-items:center}
.zoom output{min-width:52px; text-align:center; color:var(--muted);
             font-variant-numeric:tabular-nums; font-size:12px}
main{flex:1; overflow:hidden; position:relative; background:#0c1014}
.stage{position:absolute; inset:0; overflow:auto; cursor:grab;
       display:flex; align-items:flex-start; justify-content:center; padding:24px}
.stage.drag{cursor:grabbing}
.sheet{display:none}
.sheet.on{display:block}
.paper{background:var(--paper); box-shadow:0 18px 50px rgba(0,0,0,.55)}
.paper svg{display:block; width:841px; height:594px}
footer{padding:9px 20px; border-top:1px solid var(--line); color:var(--muted);
       font-size:11.5px; letter-spacing:.03em; background:var(--panel)}
kbd{border:1px solid var(--line); border-radius:4px; padding:1px 5px;
    font:inherit; font-size:10.5px; color:var(--ink)}
</style>
</head>
<body>
<header>
  <h1>Four-Storey Vacation Home</h1>
  <span class="sub">Nine sheets · ISO A1 · A-101 to A-103 are the
  detached villa at P5; the rest are the superseded apartment scheme at P4
  and have not been redrawn</span>
</header>
<nav>
  <button class="tab" aria-selected="false"><b>A-000</b><span>Site Plan</span></button><button class="tab" aria-selected="false"><b>A-100</b><span>Ground Floor Plan</span></button><button class="tab" aria-selected="false"><b>A-101  P6</b><span>First Floor Plan — Detached Villa</span></button><button class="tab" aria-selected="false"><b>A-102  P6</b><span>Second Floor Plan — Detached Villa</span></button><button class="tab" aria-selected="false"><b>A-103  P6</b><span>Third Floor Plan — Detached Villa</span></button><button class="tab" aria-selected="false"><b>A-200</b><span>Section A–A</span></button><button class="tab" aria-selected="false"><b>A-300</b><span>Typical Apartment — Enlarged Plan</span></button><button class="tab" aria-selected="false"><b>A-301</b><span>Third Floor Apartment — Enlarged Plan</span></button><button class="tab" aria-selected="false"><b>A-302</b><span>Central Kitchen & Laundry — Enlarged Plan</span></button>
  <span class="spacer"></span>
  <span class="zoom">
    <button id="out" title="Zoom out">−</button>
    <output id="pct">100%</output>
    <button id="in" title="Zoom in">+</button>
    <button id="fit">Fit</button>
    <button id="full">1:1</button>
  </span>
</nav>

<text x="581.000" y="278.300" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="4.2333333333333325" fill="#141414" text-anchor="start" font-weight="400" letter-spacing="0.0" style="">     running north to meet it. To be confirmed by measured</text>
<text x="581.000" y="284.200" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="4.2333333333333325" fill="#141414" text-anchor="start" font-weight="400" letter-spacing="0.0" style="">     survey before any work starts on site.</text>
<text x="581.000" y="293.100" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="4.2333333333333325" fill="#141414" text-anchor="start" font-weight="400" letter-spacing="0.0" style="">2.  The south wall of both blocks stands 1.50 m further into</text>
<text x="581.000" y="299.000" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="4.2333333333333325" fill="#141414" text-anchor="start" font-weight="400" letter-spacing="0.0" style="">     the garden than the previous issue, giving each block a</text>
<text x="581.000" y="304.900" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="4.2333333333333325" fill="#141414" text-anchor="start" font-weight="400" letter-spacing="0.0" style="">     14.50 m depth. The garden corridor is 5.00 m deep west of</text>
<text x="581.000" y="310.800" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="4.2333333333333325" fill="#141414" text-anchor="start" font-weight="400" letter-spacing="0.0" style="">     the building and 3.50 m deep in front of it.</text>
<text x="581.000" y="319.700" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="4.2333333333333325" fill="#141414" text-anchor="start" font-weight="400" letter-spacing="0.0" style="">3.  Upper floor balconies cantilever a further 1.20 m south of</text>
<text x="581.000" y="325.600" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="4.2333333333333325" fill="#141414" text-anchor="start" font-weight="400" letter-spacing="0.0" style="">     that wall. Nothing projects over a boundary, but the</text>
<text x="581.000" y="331.500" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="4.2333333333333325" fill="#141414" text-anchor="start" font-weight="400" letter-spacing="0.0" style="">     overhang is subject to the local projection rule; confirm</text>

<text x="581.000" y="346.300" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="4.2333333333333325" fill="#141414" text-anchor="start" font-weight="400" letter-spacing="0.0" style="">4.  Only the west boundary is built against, so the west wall</text>

<text x="581.000" y="364.000" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="4.2333333333333325" fill="#141414" text-anchor="start" font-weight="400" letter-spacing="0.0" style="">     confirmation and are windowed on every floor; the light</text>
<text x="581.000" y="369.900" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="4.2333333333333325" fill="#141414" text-anchor="start" font-weight="400" letter-spacing="0.0" style="">     court shown in P3 has gone.</text>
<text x="581.000" y="378.800" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="4.2333333333333325" fill="#141414" text-anchor="start" font-weight="400" letter-spacing="0.0" style="">5.  The ground floor sits 0.50 m above the garden, reached by</text>

<text x="581.000" y="365.000" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="4.2333333333333325" fill="#141414" text-anchor="start" font-weight="400" letter-spacing="0.0" style="">5.  The stair is enclosed in the middle of block A and has no</text>

<script>
const sheets=[...document.querySelectorAll('.sheet')];
const tabs=[...document.querySelectorAll('.tab')];
const svgs=[...document.querySelectorAll('.paper svg')];
const stage=document.getElementById('stage');
const out=document.getElementById('pct');
const W=841, H=594;                       // ISO A1 sheet, millimetres
let z=1;

function apply(){
  z=Math.max(0.15,Math.min(4,z));
  svgs.forEach(s=>{s.style.width=(W*z)+'px';s.style.height=(H*z)+'px';});
  out.value=Math.round(z*100)+'%';
}
function fit(){
  z=Math.min((stage.clientWidth-56)/W,(stage.clientHeight-56)/H);
  apply();
}
function show(i){
  sheets.forEach((s,n)=>s.classList.toggle('on',n===i));
  tabs.forEach((t,n)=>t.setAttribute('aria-selected',n===i));
  stage.scrollTop=0;stage.scrollLeft=0;
}
tabs.forEach((t,i)=>t.onclick=()=>show(i));
document.getElementById('in').onclick=()=>{z*=1.25;apply()};
document.getElementById('out').onclick=()=>{z/=1.25;apply()};
document.getElementById('fit').onclick=fit;
document.getElementById('full').onclick=()=>{z=1;apply()};
addEventListener('keydown',e=>{
  if(e.key>='1'&&e.key<='9'){show(+e.key-1);return}
  if(e.key==='+'||e.key==='='){z*=1.25;apply()}
  if(e.key==='-'){z/=1.25;apply()}
  if(e.key==='0'){fit()}
});
stage.addEventListener('wheel',e=>{
  if(!e.ctrlKey&&!e.metaKey)return;
  e.preventDefault();z*=(e.deltaY<0?1.1:1/1.1);apply();
},{passive:false});
let dragging=false,sx=0,sy=0,ox=0,oy=0;
stage.addEventListener('pointerdown',e=>{
  dragging=true;sx=e.clientX;sy=e.clientY;
  ox=stage.scrollLeft;oy=stage.scrollTop;
  stage.classList.add('drag');stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  if(!dragging)return;
  stage.scrollLeft=ox-(e.clientX-sx);stage.scrollTop=oy-(e.clientY-sy);
});
['pointerup','pointercancel'].forEach(ev=>stage.addEventListener(ev,()=>{
  dragging=false;stage.classList.remove('drag');
}));
addEventListener('resize',fit);
show(0);fit();
</script>
</body>
</html>
